<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="username">HARSH VERMA</h1>

<div class="card">

    <div id="topAlert" class="alert"></div>

    <h2>Registration Form</h2>
    <p class="subtitle">Enter the login information for your account.</p>

    <div class="form-grid">

        <!-- First Name -->
        <div class="field">
            <label>First Name *</label>
            <input type="text" id="fname">
            <p class="error" id="fnameError"></p>
        </div>

        <!-- Last Name -->
        <div class="field">
            <label>Last Name *</label>
            <input type="text" id="lname">
            <p class="error" id="lnameError"></p>
        </div>

        <!-- Email -->
        <div class="field">
            <label>Email *</label>
            <input type="email" id="email">
            <p class="error" id="emailError"></p>
        </div>

        <!-- Phone -->
        <div class="field">
            <label>Phone Number *</label>
            <input type="text" id="phone">
            <p class="error" id="phoneError"></p>
        </div>

        <!-- Age -->
        <div class="field">
            <label>Age</label>
            <input type="number" id="age">
        </div>

        <!-- Gender -->
        <div class="field">
            <label>Gender *</label>
            <div class="gender-box">
                <label><input type="checkbox" name="gender" value="Male"> Male</label>
                <label><input type="checkbox" name="gender" value="Female"> Female</label>
                <label><input type="checkbox" name="gender" value="Other"> Other</label>
            </div>
            <p class="error" id="genderError"></p>
        </div>

        <!-- Address (Full Width) -->
        <div class="field-full">
            <label>Address</label>
            <textarea id="address"></textarea>
        </div>

        <!-- Country -->
        <div class="field">
            <label>Country *</label>
            <select id="country">
                <option value="">Select Country</option>
                <option value="India">India</option>
            </select>
            <p class="error" id="countryError"></p>
        </div>

        <!-- State -->
        <div class="field">
            <label>State *</label>
            <select id="state"></select>
            <p class="error" id="stateError"></p>
        </div>

        <!-- City -->
        <div class="field">
            <label>City *</label>
            <select id="city"></select>
            <p class="error" id="cityError"></p>
        </div>

        <!-- Password -->
        <div class="field">
            <label>Password *</label>
            <input type="password" id="password">
            <p class="strength" id="passStrength"></p>
        </div>

        <!-- Confirm Password -->
        <div class="field">
            <label>Confirm Password *</label>
            <input type="password" id="cpassword">
            <p class="error" id="passError"></p>
        </div>

    </div>

    <!-- Terms -->
    <label style="margin-top:20px;">
        <input type="checkbox" id="terms"> I agree to Terms & Conditions *
    </label>
    <p class="error" id="termsError"></p>

    <button id="submitBtn" disabled class="next-btn">Submit</button>

</div>

<script src="script.js"></script>

</body>
</html>
